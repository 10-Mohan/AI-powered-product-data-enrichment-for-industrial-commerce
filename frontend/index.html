<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Extractor</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>Product Extractor</h1>
            <p>Paste raw industrial text below to automatically extract structured JSON using Google Gemini.</p>
        </header>

        <div class="main-content">
            <div class="input-section">
                <h2>Raw Text</h2>
                <textarea id="raw-text" placeholder="Paste product description, specifications, or raw OCR text here..."></textarea>
                <button id="extract-btn">Extract Data</button>
            </div>

            <div class="output-section">
                <h2>Extracted JSON</h2>
                <textarea id="json-output" placeholder="The parsed JSON will appear here..."></textarea>
                <button id="save-btn" class="secondary" disabled>Save to Database</button>
            </div>
        </div>

        <div id="status-message" class="hidden"></div>
    </div>
    <script src="app.js"></script>
</body>
</html>
